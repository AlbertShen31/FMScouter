[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:The hookimpl pytest_addhooks:pytest.PytestRemovedIn10Warning",
]

[tool.coverage.run]
relative_files = true
# Unit tests target scoring/services/config. Dash UI is excluded.
source = ["scoring", "services", "config"]
omit = [
    "tests/*",
    "scripts/*",
    "archive/*",
    "pages/*",
    "components/*",
    "app.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == [\"']__main__[\"']:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true
